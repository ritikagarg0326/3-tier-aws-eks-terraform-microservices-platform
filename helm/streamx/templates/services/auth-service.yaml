apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.auth.name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.services.auth.name }}
  ports:
    - name: {{ .Values.services.auth.service.portName }}
      port: {{ .Values.services.auth.service.port }}
      targetPort: {{ .Values.services.auth.service.targetPort }}
      protocol: {{ .Values.services.auth.service.protocol }}
  type: {{ .Values.services.auth.service.type }}
