apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.content.name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.services.content.name }}
  ports:
    - name: {{ .Values.services.content.service.portName }}
      port: {{ .Values.services.content.service.port }}
      targetPort: {{ .Values.services.content.service.targetPort }}
      protocol: {{ .Values.services.content.service.protocol }}
  type: {{ .Values.services.content.service.type }}
