
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: hotstar

spec:
  serviceName: seaweedfs
  replicas: 1

  selector:
    matchLabels:
      app: seaweedfs

  template:
    metadata:
      labels:
        app: seaweedfs

    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          imagePullPolicy: IfNotPresent

          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333

          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: hotstar-secret
                  key: MINIO_ROOT_USER

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hotstar-secret
                  key: MINIO_ROOT_PASSWORD

          ports:
            - name: s3
              containerPort: 8333
              protocol: TCP

            - name: master
              containerPort: 9333
              protocol: TCP

            - name: volume
              containerPort: 8080
              protocol: TCP

          volumeMounts:
            - name: seaweedfs-storage
              mountPath: /data

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: seaweedfs-storage
          persistentVolumeClaim:
            claimName: seaweedfs-pvc
