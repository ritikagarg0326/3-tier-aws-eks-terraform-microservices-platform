
apiVersion: apps/v1
kind: Deployment
metadata:
  name: history-service
  namespace: hotstar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: history-service
  template:
    metadata:
      labels:
        app: history-service
    spec:
      containers:
        - name: history-service
          image: hotstar/history-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: hotstar-config
            - secretRef:
                name: hotstar-secret
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hotstar-secret
                  key: HISTORY_DATABASE_URL
