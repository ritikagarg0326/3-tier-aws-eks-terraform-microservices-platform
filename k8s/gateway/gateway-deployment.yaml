
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: hotstar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: hotstar/api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: hotstar-config
            - secretRef:
                name: hotstar-secret
---