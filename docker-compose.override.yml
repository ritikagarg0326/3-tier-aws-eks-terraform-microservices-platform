# Loaded automatically by `docker compose up` for local practice: exposes internals on localhost ONLY.
# Delete this file (or run with `-f docker-compose.yml`) to publish just the frontend and gateway.
services:
  mysql:
    ports: ["127.0.0.1:3307:3306"]       # mysql -h127.0.0.1 -P3307 -uauth_svc -p auth_db
  minio:
    ports: ["127.0.0.1:9001:9001"]       # MinIO console: http://localhost:9001
  auth-service:
    ports: ["127.0.0.1:8001:8001"]       # per-service Swagger UI: http://localhost:8001/docs
  user-service:
    ports: ["127.0.0.1:8002:8002"]
  content-service:
    ports: ["127.0.0.1:8003:8003"]
  video-service:
    ports: ["127.0.0.1:8004:8004"]
  watchlist-service:
    ports: ["127.0.0.1:8005:8005"]
  history-service:
    ports: ["127.0.0.1:8006:8006"]
